# 打 tag 即发布（OIDC 可信发布，不需要 NPM_TOKEN、不需要 2FA）。
#
# npm 侧已配置 Trusted Publisher：provider=GitHub Actions，repo=zuoyunlai/dsh-healthkit，
# workflow=publish.yml，environment 留空。三处必须与这里保持一致，否则 npm 会用 404 掩盖拒绝。
#
# 依赖 npm >= 11.5.0 才支持 OIDC 发布，所以显式升级（Node 22 自带的是 10.x）。
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write          # OIDC 换 npm 凭据，必须

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # 版本真源只有 package.json；tag 写错就别发，省得上了个对不上号的版本。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag 与 package.json 版本不一致，拒绝发布"
            exit 1
          fi

      # 重跑安全：这个版本已经发过就跳过，避免 409 把整个 tag 构建判红。
      - name: 检查该版本是否已发布
        id: exists
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "dsh-healthkit@$PKG" version >/dev/null 2>&1; then
            echo "已存在：dsh-healthkit@$PKG，本次跳过发布"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.0）
        if: steps.exists.outputs.skip != '1'
        run: npm install -g npm@latest

      - name: 测试
        run: npm test

      # 发布走 OIDC（id-token: write），不需要、也不该配长期 token。
      # 注意：setup-node 仍会注入一个**占位** NODE_AUTH_TOKEN，运行日志里能看到 `XXXXX-...`，
      # 这是正常的，不代表用了 token 认证。判断真伪只看 npm 上的 _npmUser：
      # 含 trustedPublisher 才是 OIDC 发的；显示某个用户名就是 token 发的。
      # 另：发布成功后 registry 传播有延迟（2026-11-17 实测约 10 分钟，
      # 期间 registry.npmjs.org/<pkg>/<version> 会 404），别据此判定发布失败。
      - name: 发布（OIDC + provenance）
        if: steps.exists.outputs.skip != '1'
        run: npm publish --provenance --access public

  # 注意顺序：publish 失败则这里不会跑，GitHub Release 会静默缺失。
  # 这是刻意的——没发上 npm 就不该有对应的 Release 占着 latest。
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 用 CHANGELOG 首个版本段落建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(awk '/^## /{c++} c==1' CHANGELOG.md)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          fi
